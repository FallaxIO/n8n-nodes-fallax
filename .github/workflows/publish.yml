name: Publish

# Verification through the n8n Creator Portal requires a provenance statement
# on the published package, and npm only issues one for a publish that happens
# inside a workflow with `id-token: write`. So publishing from a laptop is not
# a shortcut here, it is the thing that makes the node unverifiable.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # The tag is the source of truth: a release cut as v1.2.0 must publish
      # 1.2.0, and a mismatch is a mistake worth stopping for rather than a
      # version nobody can install by the name they were given.
      - name: check the version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$TAG" || {
            echo "package.json is $version but the release is $TAG"
            exit 1
          }

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
