name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # oxlint for the general rules, then n8n's own, which are what the
      # Creator Portal review runs. A node that fails those is a node that
      # fails verification, so it fails here first.
      - run: pnpm lint

      - run: pnpm format --check
      - run: pnpm typecheck

      # Builds first: the suite loads dist/ to check that what n8n is told to
      # require is really there and really loads.
      - run: pnpm test

      - run: pnpm publint
