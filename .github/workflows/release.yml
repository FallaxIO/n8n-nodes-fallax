name: Release

# Versioning and publishing are Changesets': a merge to main either opens the
# "version packages" pull request or, if one has just landed, publishes what it
# versioned. Nothing is released from a laptop, and that is not only hygiene
# here — verification through the n8n Creator Portal requires a provenance
# statement, and npm only issues one for a publish that happens inside a
# workflow holding `id-token: write`.
#
# There is no NPM_TOKEN. The package is published through npm trusted
# publishing, which trades the long-lived token for a short-lived OIDC one
# minted per run, and which npm will only honour for the repository and
# workflow filename registered against the package. So renaming this file
# breaks publishing until npmjs.com is told the new name.

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `changeset publish` shells out to `pnpm info` and `pnpm publish`, and
      # pnpm in turn shells out to npm — it packs a tarball and hands it to
      # `npm publish`, resolving npm from the Node install directory. So the
      # npm here is what actually talks to the registry, and the version of it
      # matters twice:
      #
      #   - below 11.5.1 there is no trusted publishing, so the OIDC exchange
      #     never happens and the publish fails with ENEEDAUTH. Node 22 bundles
      #     npm 10.
      #   - from 12.0.0, `npm info --json` returns an array rather than an
      #     object. Changesets' npm path handles both, but the pnpm path — the
      #     one we are on — does not, and dies on `versions` being undefined.
      #
      # 11.x is the window where both are true. Hold it there deliberately; a
      # bare `npm@latest` reintroduces the second failure.
      - run: npm install -g npm@^11.5.1
      - run: npm --version

      - uses: changesets/action@v2.1.1
        with:
          publish-script: pnpm release
          pr-title: "release: version packages"
          commit-message: "release: version packages"
